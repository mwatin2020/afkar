services:
  postgres:
    image: postgres:16-alpine
    container_name: private-vault-postgres
    environment:
      POSTGRES_DB: private_vault
      POSTGRES_USER: vault_user
      POSTGRES_PASSWORD: vault_password
    ports:
      - "5433:5432"
    volumes:
      - private_vault_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault_user -d private_vault"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  private_vault_pgdata:
