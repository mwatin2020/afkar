[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "private-task-idea-vault-backend"
version = "0.1.0"
description = "Local-only backend for Private Task & Idea Vault"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "bcrypt>=4.3.0",
  "fastapi>=0.115.0",
  "greenlet>=3.1.1",
  "PyJWT>=2.8.0",
  "pydantic-settings>=2.6.1",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
  "email-validator (>=2.3.0,<3.0.0)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
